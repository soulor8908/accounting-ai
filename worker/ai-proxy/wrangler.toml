name = "agnes-ai-proxy"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# 限流用 KV 命名空间
# 部署前先创建：wrangler kv namespace create RATE_LIMITS
# 然后把返回的 id 填到下方
[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# 试用 API Key 通过 Secret 注入，不写在此文件中：
#   wrangler secret put AGNES_API_KEY
