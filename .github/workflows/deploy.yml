name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        env:
          VITE_TRIAL_PROXY_URL: ${{ secrets.VITE_TRIAL_PROXY_URL }}
        run: npm run build

      - name: Check Cloudflare secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::缺少 Cloudflare secrets。请在 GitHub Settings → Secrets and variables → Actions 添加："
            echo "::error::  CLOUDFLARE_API_TOKEN   - Cloudflare API Token（需 Pages:Edit 权限）"
            echo "::error::  CLOUDFLARE_ACCOUNT_ID  - Cloudflare Account ID（控制台右下角）"
            exit 1
          fi
          echo "✓ Cloudflare secrets 已配置"

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.14.0'
          command: pages deploy dist --project-name=modern-ledger --commit-dirty=true
